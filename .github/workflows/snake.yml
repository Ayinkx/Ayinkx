name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B45309&color_dots=%23EBEDF0,%23FCE8C8,%23F5CF93,%23E8A94E,%23D97706&palette=github-light
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F97316&color_dots=%230D1117,%234A2F0E,%238A5A14,%23D97706,%23FBBF24&palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
